<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  />
  <meta name="theme-color" content="#070b10" />
  <meta
    name="description"
    content="잔향동은 설명 없는 장면 해석과 점프 타이밍으로 진행하는 무언극형 퍼즐 호러 웹게임입니다."
  />
  <meta name="robots" content="index,follow,max-image-preview:large" />
  <link rel="canonical" href="https://tap-tap-cho.vercel.app/resonance-district/index.html" />
  <title>잔향동</title>
  <link rel="stylesheet" href="style.css?v=20260324a" />
  <link rel="stylesheet" href="../assets/css/site-quality.css" />
</head>
<body
  data-site-guide-mode="floating"
  data-site-guide-lang="ko"
  data-site-guide-label="게임 가이드"
  data-site-guide-close-label="닫기"
>
  <main class="app-shell">
    <section class="top-panel" aria-label="게임 정보">
      <div class="title-block">
        <p class="eyebrow">Silent Puzzle Horror Prototype</p>
        <h1>잔향동</h1>
        <p class="lede">설명 없이 시작해, 장면만으로 세계를 읽게 하는 무언극형 퍼즐 호러 플랫폼.</p>
      </div>

      <div class="control-row">
        <button id="btnStart" class="button button-primary" type="button">시작</button>
        <button id="btnFullscreen" class="button button-secondary" type="button" aria-pressed="false">전체</button>
      </div>

      <div class="hud-grid" aria-label="현재 상태">
        <div class="hud-card">
          <span class="hud-label">챕터</span>
          <strong id="hudChapter">배수로</strong>
        </div>
        <div class="hud-card">
          <span class="hud-label">데스</span>
          <strong id="hudDeaths">0</strong>
        </div>
        <div class="hud-card">
          <span class="hud-label">잔향</span>
          <strong id="hudEchoes">0 / 2</strong>
        </div>
        <div class="hud-card">
          <span class="hud-label">상태</span>
          <strong id="hudStatus">대기</strong>
        </div>
      </div>
    </section>

    <section id="stageShell" class="stage-shell" aria-label="게임 화면">
      <div id="stageCard" class="stage-card">
        <canvas id="game" width="960" height="540" aria-label="잔향동 게임 화면"></canvas>

        <div id="message" class="message" aria-live="polite"></div>

        <div id="touchControls" class="touch-controls" aria-label="터치 조작">
          <button class="touch-button" data-action="left" type="button" aria-label="왼쪽 이동">◀</button>
          <button class="touch-button jump" data-action="jump" type="button" aria-label="점프">▲</button>
          <button class="touch-button" data-action="right" type="button" aria-label="오른쪽 이동">▶</button>
        </div>
      </div>

      <p class="hint">조작: `A/D` 또는 방향키로 이동, `W`/`Space`로 점프. 모바일은 하단 버튼을 사용합니다.</p>
    </section>
  </main>

  <p class="credits">
    발소리:
    <a href="https://opengameart.org/content/footsteps-on-different-surfaces" target="_blank" rel="noreferrer">
      Footsteps on different surfaces
    </a>
    by congusbongus,
    <a href="https://creativecommons.org/licenses/by/3.0/" target="_blank" rel="noreferrer">CC-BY 3.0</a>.
    금속 샘플 상세 출처는 <a href="ASSET-CREDITS.md" target="_blank" rel="noreferrer">ASSET-CREDITS.md</a>.
  </p>

  <script src="game.js?v=20260324b"></script>
  <script src="../assets/js/site-quality.js"></script>
</body>
</html>
