<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#f4d8c2" />
  <meta
    name="description"
    content="토끼푸딩 바는 드롭 위치 조절과 다음 피스 예측이 핵심인 세로형 물리 머지 웹게임입니다."
  />
  <meta name="robots" content="index,follow,max-image-preview:large" />
  <link rel="canonical" href="https://tap-tap-cho.vercel.app/tokki-pudding-bar/index.html" />
  <title>토끼푸딩 바</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../assets/css/site-quality.css" />
</head>
<body
  data-site-guide-mode="floating"
  data-site-guide-lang="ko"
  data-site-guide-label="게임 가이드"
  data-site-guide-close-label="닫기"
>
  <main class="app-shell">
    <header class="hero" aria-label="게임 상단 정보">
      <div class="hero-copy">
        <p class="eyebrow">ARCADE PHYSICS / PORTRAIT</p>
        <h1>토끼푸딩 바</h1>
        <p id="statusLine" class="status-line" aria-live="polite">손가락으로 위치를 맞추고 놓으면 토끼푸딩이 말랑하게 떨어집니다.</p>
        <p id="userKeyHint" class="status-hint" aria-live="polite">토스 연결 정보를 확인 중입니다.</p>
      </div>
      <div class="hero-actions">
        <button id="btnFocus" class="btn btn-secondary btn-focus" type="button" aria-pressed="false">집중</button>
        <button id="btnMusic" class="btn btn-secondary btn-music" type="button" aria-pressed="true">BGM 켜짐</button>
        <button id="btnExit" class="btn btn-exit" type="button">종료</button>
      </div>
    </header>

    <section class="hud" aria-label="점수 정보">
      <div class="hud-item">
        <span>점수</span>
        <strong id="score">0</strong>
      </div>
      <div class="hud-item">
        <span>최고</span>
        <strong id="best">0</strong>
      </div>
      <div class="hud-item">
        <span>다음</span>
        <strong id="nextPiece">젤리</strong>
      </div>
    </section>

    <section id="stage" class="stage" aria-label="게임 화면">
      <canvas id="game" width="420" height="760" aria-label="토끼푸딩 바 물리 드롭 머지 보드"></canvas>
    </section>

  </main>

  <div id="exitModal" class="sheet-modal hidden" role="dialog" aria-modal="true" aria-labelledby="exitTitle">
    <div class="sheet-card">
      <p class="kicker">종료 확인</p>
      <h2 id="exitTitle">토끼푸딩 바를 종료할까요?</h2>
      <p class="copy">현재 기록은 저장됩니다. 계속하려면 바깥을 탭하세요.</p>
      <div class="actions">
        <button id="btnCancelExit" class="btn btn-secondary" type="button">계속 플레이</button>
        <button id="btnConfirmExit" class="btn btn-danger" type="button">종료</button>
      </div>
    </div>
  </div>

  <script src="toss-bridge.js"></script>
  <script src="game.js"></script>
  <script src="../assets/js/site-quality.js"></script>
</body>
</html>
