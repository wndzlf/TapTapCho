  <path d="M82 432H518" stroke="#21D7FF" stroke-width="3" stroke-opacity="0.34"/>
  <path d="M110 470H490" stroke="#21D7FF" stroke-width="3" stroke-opacity="0.28"/>
  <path d="M140 510H460" stroke="#21D7FF" stroke-width="2.5" stroke-opacity="0.24"/>
  <path d="M170 550H430" stroke="#21D7FF" stroke-width="2.5" stroke-opacity="0.2"/>

  <path d="M300 332V600" stroke="#21D7FF" stroke-width="4" stroke-opacity="0.48"/>
