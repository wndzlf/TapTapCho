<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Retro Hero Street Beat icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071124"/>
      <stop offset="0.52" stop-color="#15113B"/>
      <stop offset="1" stop-color="#040814"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.38" r="0.42">
      <stop offset="0" stop-color="#FFD874"/>
      <stop offset="0.5" stop-color="#FF8A7B"/>
      <stop offset="1" stop-color="#FF2E97"/>
    </radialGradient>
    <linearGradient id="heroFill" x1="0.5" y1="0.18" x2="0.5" y2="1">
      <stop offset="0" stop-color="#7AF1FF"/>
      <stop offset="1" stop-color="#13B7FF"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE483"/>
      <stop offset="1" stop-color="#FF7F73"/>
    </linearGradient>
    <filter id="glowPink" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowCyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="600" rx="136" fill="url(#bg)"/>

  <circle cx="300" cy="188" r="120" fill="url(#sun)" opacity="0.95" filter="url(#glowPink)"/>

