  <path d="M300 332L456 600" stroke="#21D7FF" stroke-width="3" stroke-opacity="0.3"/>
  <path d="M300 332L88 600" stroke="#21D7FF" stroke-width="2.5" stroke-opacity="0.18"/>
  <path d="M300 332L512 600" stroke="#21D7FF" stroke-width="2.5" stroke-opacity="0.18"/>

  <g filter="url(#glowPink)">
