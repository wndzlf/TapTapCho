    <circle cx="198" cy="685" r="11" fill="#ff4ca8"/>
    <text x="228" y="699" fill="#fff3fb" font-family="Avenir Next, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="30" font-weight="800">HERO MODE x2 SCORE</text>
