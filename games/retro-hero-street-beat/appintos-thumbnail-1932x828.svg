      <rect x="-38" y="-190" width="76" height="28" rx="14" fill="url(#visor)"/>
      <path d="M-24 -108H24L58 -22L30 176H-30L-58 -22Z" fill="url(#hero-fill)"/>
      <path d="M-24 -42L-104 42" stroke="#7cf0ff" stroke-width="22" stroke-linecap="round"/>
