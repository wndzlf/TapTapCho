    <path d="M1402 454V828" stroke-width="4.5"/>
    <path d="M1402 454L1220 828" stroke-width="3.5"/>
    <path d="M1402 454L1584 828" stroke-width="3.5"/>
    <path d="M1402 454L1142 828" stroke-width="2.8" stroke-opacity="0.42"/>
    <path d="M1402 454L1662 828" stroke-width="2.8" stroke-opacity="0.42"/>
