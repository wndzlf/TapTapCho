<svg xmlns="http://www.w3.org/2000/svg" width="1932" height="828" viewBox="0 0 1932 828" role="img" aria-label="Retro Hero Street Beat horizontal thumbnail">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1932" y2="828" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070d1d"/>
      <stop offset="46%" stop-color="#18133f"/>
      <stop offset="100%" stop-color="#090e20"/>
    </linearGradient>
    <radialGradient id="pink-halo" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1372 356) rotate(90) scale(340 340)">
      <stop offset="0%" stop-color="#ff4ca8" stop-opacity="0.92"/>
      <stop offset="58%" stop-color="#ff4ca8" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#ff4ca8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyan-glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1290 520) rotate(90) scale(380 520)">
      <stop offset="0%" stop-color="#4ee9ff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#4ee9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="panel" x1="108" y1="118" x2="908" y2="720" gradientUnits="userSpaceOnUse">
