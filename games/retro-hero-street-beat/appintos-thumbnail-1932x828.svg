    <filter id="cyan-soft-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#4ee9ff" flood-opacity="0.38"/>
    </filter>
    <filter id="vignette" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="90" flood-color="#02040d" flood-opacity="0.82"/>
    </filter>
