      <path d="M-18 172L-78 292" stroke="#1fc2ff" stroke-width="24" stroke-linecap="round"/>
      <path d="M18 172L78 292" stroke="#1fc2ff" stroke-width="24" stroke-linecap="round"/>
      <rect x="-22" y="0" width="44" height="82" rx="16" fill="#081326"/>
