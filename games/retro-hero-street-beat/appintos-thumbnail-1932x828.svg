  <text x="154" y="214" fill="#98b7ff" font-family="Avenir Next, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="42" font-weight="700" letter-spacing="8">3-LANE RHYTHM ACTION</text>
  <text x="146" y="354" fill="url(#title)" font-family="Avenir Next, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="120" font-weight="900" letter-spacing="2">RETRO HERO</text>
