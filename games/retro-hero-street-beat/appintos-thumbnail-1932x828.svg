  <text x="156" y="560" fill="#d7e2ff" font-family="Avenir Next, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="38" font-weight="600">Tap the neon lanes on the beat and chain your combo.</text>
  <text x="156" y="616" fill="#d7e2ff" font-family="Avenir Next, Pretendard, Apple SD Gothic Neo, sans-serif" font-size="38" font-weight="600">Perfect timing unlocks HERO MODE and score multipliers.</text>

